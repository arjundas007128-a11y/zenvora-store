<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZENVORA Admin</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script defer src="admin.js"></script></head>
<body><header class="site-header"><a class="brand" href="index.html">ZENVORA<span>.</span><small>ADMIN CONSOLE</small></a><nav><a href="index.html">Storefront</a></nav></header>
<main class="section"><p class="eyebrow">RESTRICTED AREA</p><h2>Admin panel</h2><p class="muted">Sign in with an account whose profile role is admin. Public sign-up does not grant admin access.</p>
<form id="adminLogin" class="panel form-panel"><label>Email<input id="adminEmail" type="email" required></label><label>Password<input id="adminPassword" type="password" required></label><button class="primary" type="submit">Sign in</button><p id="adminMessage" class="message"></p></form>
<section id="adminArea" class="hidden"><div class="section-heading"><h2>Orders</h2><button id="reload" class="secondary">Refresh</button></div><div id="adminOrders" class="panel"></div>
<div class="section-heading"><h2>Add product</h2></div><form id="productForm" class="panel form-panel"><label>Product name<input id="pName" required maxlength="100"></label><label>Category<input id="pCategory" required maxlength="60"></label><label>Price (INR)<input id="pPrice" type="number" min="1" max="1000000" required></label><label>Image URL (optional)<input id="pImage" type="url" placeholder="https://..."></label><label>Description<input id="pDescription" maxlength="300"></label><button class="primary" type="submit">Add product</button><p id="productMessage" class="message"></p></form></section>
</main></body></html>
